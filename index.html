<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal homepage of Nitin Vunnam.">
  <title>Nitin Vunnam</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2230%22%20height%3D%2230%22%20rx%3D%228%22%20fill%3D%22%2327231f%22%2F%3E%3Cpath%20d%3D%22M6%2022V10l8%2012V10m4%200%204%2012%204-12%22%20fill%3D%22none%22%20stroke%3D%22%23faf5e9%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E" type="image/svg+xml" sizes="any">
  <style>
    :root {
      color-scheme: light;
      --paper: #faf5e9;
      --ink: #27231f;
      --muted: #625b50;
      --rule: #dfd5c5;
      --accent: var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Instrument Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 3rem, 58rem);
      margin-inline: auto;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 1.5rem;
      color: var(--muted);
      font-size: .85rem;
    }

    header { border-bottom: 1px solid var(--rule); }
    footer { border-top: 1px solid var(--rule); }

    .monogram {
      display: grid;
      width: 2.55rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--rule);
      border-radius: 50%;
      color: var(--ink);
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .04em;
    }

    main {
      padding-block: clamp(2.5rem, 6vw, 5rem) 1.75rem;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(9rem, 19vw, 13rem);
      grid-template-areas:
        "heading portrait"
        "details portrait";
      grid-template-rows: auto 1fr;
      align-items: start;
      column-gap: clamp(1.5rem, 4vw, 3rem);
      row-gap: 1.25rem;
    }

    .heading { grid-area: heading; }
    .details { grid-area: details; }

    .portrait {
      grid-area: portrait;
      display: block;
      width: 100%;
      height: auto;
      border-radius: .5rem;
    }

    @media (max-width: 40rem) {
      .hero {
        grid-template-columns: 1fr;
        grid-template-areas: "heading" "portrait" "details";
        grid-template-rows: auto;
      }
      .portrait { width: min(10rem, 100%); }
    }

    h1 {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(3rem, 8.5vw, 7.25rem);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: 1;
    }

    .affiliation {
      margin: .8rem 0 0;
      color: var(--ink);
    }

    p {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.65;
    }

    a {
      color: var(--accent);
      font-weight: 600;
      text-underline-offset: .27em;
    }

    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 1.5rem;
    }

    .linkedin {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      text-decoration: none;
    }

    .linkedin span {
      display: grid;
      width: 1.4rem;
      height: 1.4rem;
      place-items: center;
      border-radius: .2rem;
      background: var(--accent);
      color: var(--paper);
      font-size: .85rem;
      font-weight: 750;
    }

    .contact { margin-top: 1.5rem; }
    .contact h2 { margin: 0; font-size: 1rem; }
    .contact p { margin: .4rem 0 0; font-size: 1rem; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span class="monogram" aria-hidden="true">NV</span>
      <a class="linkedin" href="https://www.linkedin.com/in/nitin-vunnam/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)"><span aria-hidden="true">in</span></a>
    </header>
    <main>
      <div class="hero">
        <div class="heading">
          <h1>Nitin Vunnam</h1>
          <p class="affiliation">Electrical and Computer Engineering @ UT Austin</p>
        </div>
        <img class="portrait" src="./portrait.jpg" alt="Portrait of Nitin Vunnam" width="800" height="800">
        <div class="details">
          <p>Take a look at what I’m working on and what I’ve done.</p>
          <nav class="links" aria-label="Personal links">
            <a href="./Nitin_Vunnam_resume.pdf" target="_blank" rel="noopener noreferrer" aria-label="Resume (opens in a new tab)">Resume <span aria-hidden="true">&#8599;</span></a>
            <a href="https://github.com/nitinvunnam" target="_blank" rel="noopener noreferrer" aria-label="GitHub (opens in a new tab)">GitHub <span aria-hidden="true">&#8599;</span></a>
            <a href="https://www.linkedin.com/in/nitin-vunnam/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)">LinkedIn <span aria-hidden="true">&#8599;</span></a>
          </nav>
          <section class="contact" aria-labelledby="contact-heading">
            <h2 id="contact-heading">Contact</h2>
            <p>nitinvunnam06 [at] gmail [dot] com</p>
          </section>
        </div>
      </div>
    </main>
    <footer><span>&copy; Nitin Vunnam</span></footer>
  </div>
</body>
</html>
