<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal homepage of Nitin Vunnam.">
  <title>Nitin Vunnam</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f9f8f4;
      --ink: #222320;
      --muted: #5d6059;
      --rule: #dcded5;
      --accent: #315c43;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Instrument Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: min(100% - 3rem, 58rem);
      min-height: 100svh;
      margin-inline: auto;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 1.5rem;
      color: var(--muted);
      font-size: .85rem;
    }

    header { border-bottom: 1px solid var(--rule); }
    footer { border-top: 1px solid var(--rule); }

    .monogram {
      display: grid;
      width: 2.55rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--rule);
      border-radius: 50%;
      color: var(--ink);
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .04em;
    }

    main {
      display: grid;
      align-items: center;
      flex: 1;
      padding-block: clamp(5rem, 15vh, 10rem);
    }

    h1 {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(3rem, 10.3vw, 7.25rem);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: 1;
    }

    .affiliation {
      margin: .8rem 0 0;
      color: var(--ink);
    }

    p {
      margin: 1.45rem 0 2rem;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.65;
    }

    a {
      color: var(--accent);
      font-weight: 600;
      text-underline-offset: .27em;
    }

    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 1.5rem;
    }

    .linkedin {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      text-decoration: none;
    }

    .linkedin span {
      display: grid;
      width: 1.4rem;
      height: 1.4rem;
      place-items: center;
      border-radius: .2rem;
      background: var(--accent);
      color: var(--paper);
      font-size: .85rem;
      font-weight: 750;
    }

    .contact { margin-top: 2.75rem; }
    .contact h2 { margin: 0; font-size: 1rem; }
    .contact p { margin: .4rem 0 0; font-size: 1rem; overflow-wrap: anywhere; }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #181a17;
        --ink: #f1f0e8;
        --muted: #b3b6aa;
        --rule: #383c33;
        --accent: #a9cfab;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span class="monogram" aria-hidden="true">NV</span>
      <a class="linkedin" href="https://www.linkedin.com/in/nitin-vunnam/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)"><span aria-hidden="true">in</span></a>
    </header>
    <main>
      <div>
        <h1>Nitin Vunnam</h1>
        <p class="affiliation">Electrical and Computer Engineering @ UT Austin</p>
        <p>Take a look at what I’m working on and what I’ve done.</p>
        <nav class="links" aria-label="Personal links">
          <a href="./Nitin_Vunnam_resume.pdf" target="_blank" rel="noopener noreferrer" aria-label="Resume (opens in a new tab)">Resume <span aria-hidden="true">&#8599;</span></a>
          <a href="https://github.com/nitinvunnam" target="_blank" rel="noopener noreferrer" aria-label="GitHub (opens in a new tab)">GitHub <span aria-hidden="true">&#8599;</span></a>
          <a href="https://www.linkedin.com/in/nitin-vunnam/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)">LinkedIn <span aria-hidden="true">&#8599;</span></a>
        </nav>
        <section class="contact" aria-labelledby="contact-heading">
          <h2 id="contact-heading">Contact</h2>
          <p>nitinvunnam06 [at] gmail [dot] com</p>
        </section>
      </div>
    </main>
    <footer><span>&copy; Nitin Vunnam</span></footer>
  </div>
</body>
</html>
