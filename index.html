  <style>
    :root {
      color-scheme: light;
      --paper: #faf5e9;
      --ink: #27231f;
      --muted: #625b50;
      --rule: #dfd5c5;
      --accent: var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Instrument Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 3rem, 58rem);
      margin-inline: auto;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 1.5rem;
      color: var(--muted);
      font-size: .85rem;
    }

    header { border-bottom: 1px solid var(--rule); }
    footer { border-top: 1px solid var(--rule); }

    .monogram {
      display: grid;
      width: 2.55rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--rule);
      border-radius: 50%;
      color: var(--ink);
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .04em;
    }

    main {
      padding-block: clamp(2.5rem, 6vw, 5rem) 1.75rem;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(9rem, 19vw, 13rem);
      grid-template-areas:
        "heading portrait"
        "details portrait";
      grid-template-rows: auto 1fr;
      align-items: start;
      column-gap: clamp(1.5rem, 4vw, 3rem);
      row-gap: 1.25rem;
    }

    .heading { grid-area: heading; }
    .details { grid-area: details; }

    .portrait {
      grid-area: portrait;
      display: block;
      width: 100%;
      height: auto;
      border-radius: .5rem;
    }

    @media (max-width: 40rem) {
      .hero {
        grid-template-columns: 1fr;
        grid-template-areas: "heading" "portrait" "details";
        grid-template-rows: auto;
      }
      .portrait { width: min(10rem, 100%); }
    }

    h1 {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(3rem, 8.5vw, 7.25rem);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: 1;
    }

    .affiliation {
      margin: .8rem 0 0;
      color: var(--ink);
    }

    p {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.65;
    }

    a {
      color: var(--accent);
      font-weight: 600;
      text-underline-offset: .27em;
    }

    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 1.5rem;
    }

    .linkedin {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      text-decoration: none;
    }

    .linkedin span {
      display: grid;
      width: 1.4rem;
      height: 1.4rem;
      place-items: center;
      border-radius: .2rem;
      background: var(--accent);
      color: var(--paper);
      font-size: .85rem;
      font-weight: 750;
    }

    .contact { margin-top: 1.5rem; }
    .contact h2 { margin: 0; font-size: 1rem; }
    .contact p { margin: .4rem 0 0; font-size: 1rem; overflow-wrap: anywhere; }
  </style>
</head>
